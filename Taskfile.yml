version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  setup:
    desc: Install dependencies (OpenTofu, Talosctl, Kubectl, Task, pre-commit)
    cmds:
      - ./scripts/setup.sh

  lint:
    desc: Lint and format code (OpenTofu, YAML)
    cmds:
      - tofu fmt -check -recursive infrastructure/opentofu
      - yamllint -c infrastructure/.yamllint apps/ infrastructure/
      - tflint --chdir=infrastructure/opentofu/cluster --recursive

  fmt:
    desc: Format OpenTofu code
    cmds:
      - tofu fmt -recursive infrastructure/opentofu

  validate:
    desc: Validate the cluster OpenTofu root
    dir: infrastructure/opentofu/cluster
    cmds:
      - tofu init -backend=false
      - tofu validate

  security:
    desc: Run security scans (Trivy, Checkov, Gitleaks)
    cmds:
      # Skip the upstream-vendored Cilium/Flux bootstrap manifests (not our
      # config to fix; reviewed at render time). Matches the CI Trivy step.
      - trivy config infrastructure/ --skip-files "**/bootstrap-manifests/cilium*.yaml" --skip-files "**/bootstrap-manifests/flux-install.yaml"
      # Same scope as CI (whole opentofu tree, not just cluster).
      - checkov -d infrastructure/opentofu --config-file .checkov.yaml
      - gitleaks detect --source . --no-git

  test:
    desc: Run OpenTofu tests (cluster root)
    dir: infrastructure/opentofu/cluster
    cmds:
      - tofu test

  cluster-security:
    desc: "Run runtime security validation tests on the cluster"
    cmds:
      - ./scripts/ops/cluster-security-tests.sh

  # ===========================================================================
  # Talos image (decoupled — build once per Talos version, reused by clusters)
  # ===========================================================================

  talos-image:
    desc: "Build + publish the Talos image for a provider. Usage: task talos-image PROVIDER=scaleway|ovh|outscale [VERSION=v1.13.4]"
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
      VERSION: '{{.VERSION | default "v1.13.4"}}'
    cmds:
      - ./scripts/bootstrap/talos-image.sh {{.PROVIDER}} {{.VERSION}}

  # ===========================================================================
  # Cluster Lifecycle
  # ===========================================================================

  infra-management:
    desc: "Deploy the management cluster. Usage: task infra-management [PROVIDER=scaleway|ovh|outscale]"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - ../../../scripts/internal/ensure-buckets.sh envs/management-{{.PROVIDER}}.tfvars
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/management-{{.PROVIDER}}.tfvars)
      - tofu apply -var-file="envs/management-{{.PROVIDER}}.tfvars" -var talos_bootstrap=false
      - ../../../scripts/ops/backup-state.sh . || echo "⚠ state backup skipped/failed (does the -backup bucket exist?)"

  infra-workload:
    desc: "Deploy a workload cluster. Usage: task infra-workload PROVIDER=ovh"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - ../../../scripts/internal/ensure-buckets.sh envs/workload-{{.PROVIDER}}.tfvars
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/workload-{{.PROVIDER}}.tfvars)
      - tofu apply -var-file="envs/workload-{{.PROVIDER}}.tfvars" -var talos_bootstrap=false
      - ../../../scripts/ops/backup-state.sh . || echo "⚠ state backup skipped/failed (does the -backup bucket exist?)"

  management:
    desc: "Phase 2: open SSH tunnels (from state) + bootstrap the management cluster. Usage: task management [PROVIDER=scaleway|ovh|outscale] KEY=~/.ssh/yourkey"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/management-{{.PROVIDER}}.tfvars)
      - SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh open .
      - tofu apply -var-file="envs/management-{{.PROVIDER}}.tfvars" -var talos_bootstrap=true
      - ../../../scripts/ops/backup-state.sh . || echo "⚠ state backup skipped/failed (does the -backup bucket exist?)"

  rolling-replace:
    desc: "Replace nodes one at a time (drain→targeted apply→wait) with NO downtime. Use after a ForceNew change (instance_type / Talos image) instead of infra-management, which replaces all nodes in parallel and breaks etcd quorum. Usage: task rolling-replace PROVIDER=scaleway [KEY=~/.ssh/key] [-- --workers-only|--cp-only|--dry-run]"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/management-{{.PROVIDER}}.tfvars)
      - SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh open .
      - ../../../scripts/ops/rolling-replace.sh {{.PROVIDER}} {{.CLI_ARGS}}
      - ../../../scripts/ops/backup-state.sh . || echo "⚠ state backup skipped/failed (does the -backup bucket exist?)"

  workload:
    desc: "Phase 2: open tunnels + bootstrap a workload cluster. Usage: task workload PROVIDER=ovh KEY=~/.ssh/yourkey"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/workload-{{.PROVIDER}}.tfvars)
      - SSH_KEY="{{.KEY}}" ../../../scripts/bootstrap/talos-tunnels.sh open .
      - tofu apply -var-file="envs/workload-{{.PROVIDER}}.tfvars" -var talos_bootstrap=true
      - ../../../scripts/ops/backup-state.sh . || echo "⚠ state backup skipped/failed (does the -backup bucket exist?)"

  close-tunnels:
    desc: "Close the Talos API SSH tunnels opened for Phase 2"
    cmds:
      - ./scripts/bootstrap/talos-tunnels.sh close infrastructure/opentofu/cluster

  backup-state:
    desc: "Replicate the (encrypted) tfstate to the -backup store (post-apply). Set BACKUP_AWS_* for a cross-provider replica."
    cmds:
      - ./scripts/ops/backup-state.sh infrastructure/opentofu/cluster

  destroy-management:
    desc: "Destroy a management cluster. Usage: task destroy-management PROVIDER=ovh"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/management-{{.PROVIDER}}.tfvars)
      - tofu state rm module.talos.talos_machine_secrets.this 2>/dev/null || true
      - tofu destroy -var-file="envs/management-{{.PROVIDER}}.tfvars"

  destroy-workload:
    desc: "Destroy a workload cluster. Usage: task destroy-workload PROVIDER=ovh"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/workload-{{.PROVIDER}}.tfvars)
      - tofu destroy -var-file="envs/workload-{{.PROVIDER}}.tfvars"

  state-list:
    desc: "tofu state list (show resources in the state)"
    dir: infrastructure/opentofu/cluster
    vars:
      PROVIDER: '{{.PROVIDER | default "scaleway"}}'
      KEY: '{{.KEY | default "~/.ssh/id_ed25519"}}'
    env:
      AWS_ACCESS_KEY_ID:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} ak
      AWS_SECRET_ACCESS_KEY:
        sh: ../../../scripts/internal/resolve-s3-cred.sh {{.PROVIDER}} sk
      TF_VAR_outscale_access_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale ak || true'
      TF_VAR_outscale_secret_key_id:
        sh: '[ "{{.PROVIDER}}" = outscale ] && ../../../scripts/internal/resolve-s3-cred.sh outscale sk || true'
    cmds:
      - tofu init -reconfigure $(../../../scripts/internal/tf-backend.sh envs/management-{{.PROVIDER}}.tfvars)
      - tofu state list
  # Multi-Cluster Management
  # ===========================================================================

  failover:
    desc: "Cross-provider failover: stand up a 2nd management cluster on another cloud. Usage: task failover PROVIDER=ovh"
    vars:
      PROVIDER: '{{.PROVIDER | default "ovh"}}'
    cmds:
      - ./scripts/bootstrap/failover-management.sh "{{.PROVIDER}}"

  # ===========================================================================
  # Local Testing (Docker / WSL2)
  # ===========================================================================

  local-render-manifests:
    desc: "Render simplified Cilium manifest for local Docker testing (no WireGuard)"
    cmds:
      - ./scripts/bootstrap/render-bootstrap-manifests.sh --local

  local-up:
    desc: "Deploy the local Talos cluster — 3 CP + 3 workers (config + containers + bootstrap + kubeconfig)"
    dir: infrastructure/opentofu-local
    cmds:
      - tofu init -upgrade > /dev/null 2>&1 || tofu init > /dev/null
      - |
        export TF_VAR_cilium_manifest="$(cat ../opentofu/cluster/bootstrap-manifests/cilium-local.yaml 2>/dev/null || echo 'placeholder')"
        tofu apply -var talos_bootstrap=true -auto-approve

  local-test:
    desc: "Full end-to-end local test: 3 CP + 3 workers + etcd quorum + Cilium + Flux + GitOps"
    cmds:
      - ./scripts/dev/test-talos-local.sh

  local-status:
    desc: "Check local cluster health (3 CP + 2 workers)"
    cmds:
      - |
        export KUBECONFIG=infrastructure/opentofu-local/kubeconfig
        export TALOSCONFIG=infrastructure/opentofu-local/talosconfig
        echo "=== etcd quorum ===" && talosctl --nodes 10.5.0.10 --endpoints 127.0.0.1:50000 etcd members || true
        echo "=== Kubernetes nodes ===" && kubectl get nodes -o wide || true
        echo "=== kube-system pods ===" && kubectl get pods -n kube-system || true
        echo "=== Flux Kustomizations ===" && flux get kustomizations 2>/dev/null || echo "Flux not deployed yet"
        echo "=== Flux HelmReleases ===" && flux get helmreleases -A 2>/dev/null || echo "no HelmReleases"

  local-flux:
    desc: "Port-forward Flux source-controller UI (debug) to localhost:9090"
    cmds:
      - |
        export KUBECONFIG=infrastructure/opentofu-local/kubeconfig
        echo "Flux source-controller → http://localhost:9090"
        kubectl -n flux-system port-forward svc/source-controller 9090:80

  local-down:
    desc: "Destroy local Talos cluster (containers + volumes + network + state)"
    cmds:
      # Delegate to the script's --destroy: `tofu destroy` alone can't tear the
      # cluster down (machine_secrets is prevent_destroy'd, so it errors and
      # leaves containers + state behind). --destroy also removes the containers,
      # volumes, network, and the ephemeral local state for a clean slate.
      - ./scripts/dev/test-talos-local.sh --destroy

  # ===========================================================================
  # Bootstrap & Secrets
  # ===========================================================================

  bootstrap:
    desc: "Bootstrap Flux on a running cluster (if inline manifests failed). Usage: task bootstrap [ROLE=management|local]"
    vars:
      ROLE: '{{.ROLE | default "local"}}'
    cmds:
      - |
        export KUBECONFIG=infrastructure/opentofu-local/kubeconfig
        flux install
        kubectl apply -k apps/flux/{{.ROLE}}

  register-spoke:
    desc: "Register a spoke cluster in Flux hub. Usage: task register-spoke CLUSTER=openaether-ovh-prod PROVIDER=ovh"
    vars:
      CLUSTER: '{{.CLUSTER | default ""}}'
      PROVIDER: '{{.PROVIDER | default ""}}'
    cmds:
      - ./scripts/bootstrap/register-spoke.sh "{{.CLUSTER}}" "{{.PROVIDER}}"

  render-manifests:
    desc: Render/update bootstrap manifests (Cilium + Flux)
    cmds:
      - ./scripts/bootstrap/render-bootstrap-manifests.sh

  kubeconfig:
    desc: Retrieve kubeconfig from OpenTofu outputs
    dir: infrastructure/opentofu/cluster
    cmds:
      - tofu output -raw kubeconfig > kubeconfig
      - tofu output -raw talosconfig > talosconfig
      - echo "KUBECONFIG and TALOSCONFIG written to infrastructure/opentofu/cluster/"
