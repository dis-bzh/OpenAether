# OpenAether 0.5.0 — Foundation Storage
# local-path: provisioner simple (existant, défaut)
# Longhorn Sprint C: stockage distribué, multi-StorageClass, chiffrement OpenBao
# MinIO: overlay local uniquement (apps/overlays/local/)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - install.yaml
  - longhorn.yaml
  - storageclasses.yaml
  - longhorn-encryption-secret.yaml

patches:
  - target:
      kind: StorageClass
      name: local-path
    patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          storageclass.kubernetes.io/is-default-class: "true"
  - target:
      kind: Namespace
      name: local-path-storage
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
