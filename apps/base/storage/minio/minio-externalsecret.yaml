# OpenAether 0.5.0 Sprint C — Credentials MinIO depuis OpenBao
# Seeding: vault/bootstrap-roles-job.yaml step 10 génère accessKey/secretKey
# dans OpenBao (secret/data/minio/root) si absents.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-root-credentials
  namespace: foundation-storage
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: minio
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: minio-root-credentials
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef:
        key: minio/root
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: minio/root
        property: secretKey
