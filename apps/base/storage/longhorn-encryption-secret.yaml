# OpenAether 0.5.0 Sprint C — Secret chiffrement LUKS pour Longhorn
# ──────────────────────────────────────────────────────────────────
# Longhorn chiffrement LUKS requiert un Secret Kubernetes dans longhorn-system
# avec la clé CRYPTO_KEY_VALUE. Ce Secret est géré par ESO depuis OpenBao.
#
# Seeding: vault/bootstrap-roles-job.yaml step 10 génère la passphrase
# dans OpenBao (secret/data/longhorn/encryption.passphrase) si absente.
#
# Rotation de clé: une nouvelle version OpenBao met à jour ce Secret.
# Les volumes existants gardent leur ancienne clé LUKS (re-key = opération
# offline sur le volume individuel via longhorn-manager). Les nouveaux volumes
# utilisent la nouvelle clé.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-encryption
  namespace: longhorn-system
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: storage
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: longhorn-encryption
    creationPolicy: Owner
    template:
      data:
        # Longhorn attend CRYPTO_KEY_VALUE comme clé dans le Secret.
        CRYPTO_KEY_VALUE: "{{ .passphrase }}"
        # Algorithme et provider sont dans le StorageClass (parameters).
        # Le Secret ne contient QUE la passphrase.
  data:
    - secretKey: passphrase
      remoteRef:
        key: longhorn/encryption
        property: passphrase
