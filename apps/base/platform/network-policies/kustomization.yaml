# OpenAether 0.5.0 — NetworkPolicies (allow-list explicites)
# Sprint 0: on déploie UNIQUEMENT les allow-list essentiels (DNS, kube-api).
# Le default-deny-all CCNP sera ajouté en sprint 1, après validation
# exhaustive des flux existants (mode audit Hubble au préalable).
# NB: Cilium ignore les NetworkPolicy k8s natives, on utilise UNIQUEMENT
# CiliumNetworkPolicy (L3/L4/L7 via cilium-envoy).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - allow-dns.yaml
  - allow-kube-api.yaml
