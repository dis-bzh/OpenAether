# OpenAether 0.5.0 — Allow Kube API (TCP 443 vers API server)
# CCNP qui autorise tous les pods à parler au kube-apiserver.
# Indispensable pour: cert-manager webhooks, Kyverno webhooks, ArgoCD,
# ESO, CNPG, OpenBao auth kubernetes, etc.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: allow-kube-api
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: platform
spec:
  description: "Allow egress TCP 443 vers kube-apiserver depuis tous les pods."
  endpointSelector: {}
  egress:
    - toServices:
        - k8sService:
            serviceName: kubernetes
            namespace: default
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Endpoints backend (kubelet API + service CIDR) pour cilium-operator
    - toEntities:
        - kube-apiserver
