# OpenAether 0.5.0 — Egress CNP pour le Job bootstrap
# ───────────────────────────────────────────────────────────────────────────
# Les CCNP cluster-wide allow-dns/allow-kube-api (endpointSelector: {}) ont une
# règle EGRESS → en Cilium, toute règle egress bascule l'endpoint en
# default-deny egress. Conséquence: TOUS les pods sont limités à DNS+kube-api
# tant qu'ils n'ont pas de règle egress explicite supplémentaire.
# Le Job bootstrap doit en plus joindre l'API du root OpenBao (8200) → ce CNP.
#
# NB: on sélectionne `app: openbao-bootstrap` (label stable; le transformer
# includeSelectors du kustomization parent écrase openaether.io/component).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-bootstrap
  namespace: foundation-pki-root
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-bootstrap
spec:
  description: "Job bootstrap: egress vers DNS, kube-apiserver (kubectl) et
    l'API du root OpenBao (init/unseal/transit/login). Aucun ingress."
  endpointSelector:
    matchLabels:
      app: openbao-bootstrap
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # kube-apiserver (kubectl create token / secrets / patch sts)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # API du root OpenBao (HTTP 8200) — via svc openbao-internal → pod root
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-pki-root
            app: openbao-pki-root
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # API du workload OpenBao (HTTP 8200) — init raft one-time (step 7)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: foundation-vault
            app: openbao
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
