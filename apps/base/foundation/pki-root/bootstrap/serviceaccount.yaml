# OpenAether 0.5.0 — SA + RBAC pour le Job bootstrap (consolidé)
# Un seul Job orchestre tout via l'API HTTP OpenBao (svc DNS, pas de
# port-forward/exec). Permissions least-privilege réparties sur 2 ns:
#  - foundation-pki-root : RW Secret openbao-root-recovery, get pods
#  - foundation-vault    : RW Secret openbao-seal-token, create token du SA
#                          openbao-workload, patch StatefulSet openbao
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-bootstrap
  namespace: foundation-pki-root
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-bootstrap
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-bootstrap
  namespace: foundation-pki-root
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-bootstrap
rules:
  # Lire l'état des pods root (attente readiness avant init).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Stocker les unseal keys Shamir + root token (JAMAIS commité).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["openbao-root-recovery"]
    verbs: ["get", "create", "update", "patch"]
  # create n'autorise pas resourceNames → règle séparée pour la création.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-bootstrap
  namespace: foundation-pki-root
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-bootstrap
subjects:
  - kind: ServiceAccount
    name: openbao-bootstrap
    namespace: foundation-pki-root
roleRef:
  kind: Role
  name: openbao-bootstrap
  apiGroup: rbac.authorization.k8s.io
# NB: le RBAC cross-namespace côté foundation-vault (Role/RoleBinding
# openbao-bootstrap-vault) est défini dans apps/base/foundation/vault/
# bootstrap-rbac.yaml — PAS ici — car la directive `namespace:
# foundation-pki-root` de ce kustomization réécrirait leur namespace.
