# OpenAether 0.5.0 — OpenBao root config (Shamir 3-of-5, raft 1 répl)
# TODO sprint 1: activer TLS via cert-manager (openbao-server-tls).
#
# NB OpenBao 2.x (validé localement sur 2.5.4):
#  - `disable_mlock` est OBSOLÈTE (no-op si true, ERREUR si false). On le retire
#    + on retire la capability IPC_LOCK du StatefulSet (mlock supprimé du binaire,
#    cf. https://openbao.org/docs/rfcs/mlock-removal/).
#  - `api_addr`/`cluster_addr` ne sont PAS dans le HCL: fournis via les env
#    BAO_API_ADDR/BAO_CLUSTER_ADDR (POD_IP) par le wrapper entrypoint.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-pki-root-config
  namespace: foundation-pki-root
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-pki-root
data:
  config.hcl: |
    ui = true

    listener "tcp" {
      tls_disable = 1  # TODO sprint 1: cert-manager + openbao-server-tls
      address = "[::]:8200"
      cluster_address = "[::]:8201"
    }

    storage "raft" {
      path = "/bao/data"

      retry_join {
        leader_api_addr = "http://127.0.0.1:8200"
      }
    }

    # seal "shamir" est le défaut quand aucun autre seal n'est configuré.
    # Init via le Job bootstrap: 5 unseal keys, threshold 3 (cérémonie offline).
  entrypoint.sh: |
    #!/bin/sh
    # Wrapper: fournit api_addr/cluster_addr via DNS stable (PAS POD_IP éphémère,
    # qui casserait raft après un restart). Le root n'a pas de seal token (il EST
    # la source du transit seal).
    set -e
    POD_FQDN="${HOSTNAME}.openbao-pki-root-headless.${POD_NAMESPACE}.svc.cluster.local"
    export BAO_API_ADDR="http://${POD_FQDN}:8200"
    export BAO_CLUSTER_ADDR="http://${POD_FQDN}:8201"
    echo "raft addr: ${POD_FQDN}"
    exec bao server -config=/bao/config/config.hcl
