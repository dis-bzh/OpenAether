apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-pki-root
  namespace: foundation-pki-root
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-pki-root
automountServiceAccountToken: true
# Pas d'imagePullSecrets nécessaire (image publique openbao/openbao).
---
# Auth kubernetes: quand token_reviewer_jwt n'est pas fourni, OpenBao (in-pod)
# utilise SON propre SA pour appeler la TokenReview API. Le SA openbao-pki-root
# a donc besoin de system:auth-delegator (validé: doc api-docs/auth/kubernetes).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-pki-root-tokenreview
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-pki-root
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao-pki-root
    namespace: foundation-pki-root
