apiVersion: v1
kind: Service
metadata:
  name: openbao-pki-root-headless
  namespace: foundation-pki-root
  labels:
    app: openbao-pki-root
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-pki-root
spec:
  clusterIP: None
  # Pod sealed = NotReady: on publie quand même l'adresse pour le bootstrap.
  publishNotReadyAddresses: true
  ports:
    - name: api
      port: 8200
      targetPort: 8200
      protocol: TCP
    - name: cluster
      port: 8201
      targetPort: 8201
      protocol: TCP
  selector:
    app: openbao-pki-root
---
# Service exposé dans le cluster pour le workload OpenBao (transit wrap).
# Le nom DNS attendu est openbao-internal.foundation-pki-root.svc.cluster.local
# (cf. apps/base/foundation/vault/configmap.yaml seal "transit" { address }).
apiVersion: v1
kind: Service
metadata:
  name: openbao-internal
  namespace: foundation-pki-root
  labels:
    app: openbao-pki-root
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-pki-root
spec:
  # Cible du transit seal du workload: doit résoudre même si le root est
  # transitoirement NotReady (boot/unseal).
  publishNotReadyAddresses: true
  ports:
    - name: api
      port: 8200
      targetPort: 8200
      protocol: TCP
    - name: cluster
      port: 8201
      targetPort: 8201
      protocol: TCP
  selector:
    app: openbao-pki-root
---
# Service UI (accès local uniquement, sera exposé via Cilium Gateway sprint 1)
apiVersion: v1
kind: Service
metadata:
  name: openbao-pki-root-ui
  namespace: foundation-pki-root
  labels:
    app: openbao-pki-root
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprint0"
    openaether.io/component: openbao-pki-root
spec:
  type: ClusterIP
  ports:
    - name: ui
      port: 8200
      targetPort: 8200
      protocol: TCP
  selector:
    app: openbao-pki-root
