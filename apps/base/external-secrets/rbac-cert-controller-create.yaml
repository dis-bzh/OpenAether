apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-webhook-certs
  namespace: foundation-pki-management
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-webhook-certs
  namespace: foundation-pki-management
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-webhook-certs
subjects:
  - kind: ServiceAccount
    name: external-secrets-cert-controller
    namespace: foundation-pki-management
