# OpenAether 0.5.0 Sprint C — Dashboard Node Exporter Full (Grafana ID 1860)
# Sidecar Grafana découvre ce ConfigMap via label grafana_dashboard=1.
# JSON source: https://grafana.com/grafana/dashboards/1860
# Adapté: datasource variable → ${DS_VICTORIAMETRICS} (compatible VMCluster).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-node-exporter
  namespace: services-observability
  labels:
    grafana_dashboard: "1"
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana-dashboards
  annotations:
    grafana_folder: "Infrastructure"
data:
  node-exporter.json: |
    {
      "__inputs": [{"name": "DS_VICTORIAMETRICS", "label": "VictoriaMetrics", "type": "datasource", "pluginId": "prometheus"}],
      "__requires": [{"type": "grafana", "id": "grafana", "name": "Grafana", "version": "8.0.0"}],
      "title": "Node Exporter Full",
      "uid": "rYdddlPWk",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "description": "Node Exporter full dashboard (CPU, Memory, Disk, Network) for OpenAether",
      "tags": ["node", "infrastructure", "openaether"],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {"selected": false, "text": "VictoriaMetrics", "value": "VictoriaMetrics"},
            "hide": 0
          },
          {
            "name": "job",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "definition": "label_values(node_uname_info, job)",
            "query": "label_values(node_uname_info, job)",
            "refresh": 2
          },
          {
            "name": "node",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${datasource}"},
            "definition": "label_values(node_uname_info{job=~\"$job\"}, instance)",
            "query": "label_values(node_uname_info{job=~\"$job\"}, instance)",
            "refresh": 2,
            "multi": false
          }
        ]
      },
      "panels": [
        {
          "title": "CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "1 - avg(rate(node_cpu_seconds_total{job=~\"$job\", instance=~\"$node\", mode=\"idle\"}[5m]))",
              "legendFormat": "CPU Usage"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}}
        },
        {
          "title": "Memory Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "1 - (node_memory_MemAvailable_bytes{job=~\"$job\", instance=~\"$node\"} / node_memory_MemTotal_bytes{job=~\"$job\", instance=~\"$node\"})",
              "legendFormat": "Memory Usage"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}}
        },
        {
          "title": "Disk I/O",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "rate(node_disk_read_bytes_total{job=~\"$job\", instance=~\"$node\"}[5m])",
              "legendFormat": "Read {{device}}"
            },
            {
              "expr": "rate(node_disk_written_bytes_total{job=~\"$job\", instance=~\"$node\"}[5m])",
              "legendFormat": "Write {{device}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        },
        {
          "title": "Network Traffic",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "${datasource}"},
          "targets": [
            {
              "expr": "rate(node_network_receive_bytes_total{job=~\"$job\", instance=~\"$node\", device!~\"lo|veth.+\"}[5m])",
              "legendFormat": "RX {{device}}"
            },
            {
              "expr": "rate(node_network_transmit_bytes_total{job=~\"$job\", instance=~\"$node\", device!~\"lo|veth.+\"}[5m])",
              "legendFormat": "TX {{device}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "Bps"}}
        }
      ]
    }
