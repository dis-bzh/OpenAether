# OpenAether 0.5.0 Sprint C — VMOperator (VictoriaMetrics Operator)
# ──────────────────────────────────────────────────────────────────
# VMOperator installe les CRDs: VMCluster, VMAgent, VMSingle,
# VMServiceScrape, VMNodeScrape, VMPodScrape, VMRule, VMAlertManager.
# Ces CRDs permettent de déclarer scrapes, alertes et clusters en GitOps.
#
# selfHeal ArgoCD gère le race CRDs → CRs (VMCluster/VMAgent appliqués
# avant que le CRD soit installé → selfHeal re-applique automatiquement).
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: victoriametrics
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: victoriametrics-operator
spec:
  url: https://victoriametrics.github.io/helm-charts/
  interval: 1h
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-operator
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: victoriametrics-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-operator
      version: "0.47.1"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: services-observability
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    replicaCount: 2
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: victoria-metrics-operator
              topologyKey: kubernetes.io/hostname
    # Pas de webhook en mode simple (évite la complexité cert-manager pour l'operator lui-même).
    admissionWebhooks:
      enabled: false
