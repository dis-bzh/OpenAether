# OpenAether 0.5.0 Sprint C — Credentials S3 pour Loki
# En local: credentials MinIO (secret/minio/root).
# En cloud: patcher ce fichier via overlay pour pointer vers secret/s3/loki
# (credentials S3 natif du provider — Scaleway, OVH, Outscale).
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-s3-credentials
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: loki
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: loki-s3-credentials
    creationPolicy: Owner
  data:
    # En local: MinIO. En cloud: overlay patch remoteRef.key → s3/loki.
    - secretKey: accessKey
      remoteRef:
        key: minio/root
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: minio/root
        property: secretKey
