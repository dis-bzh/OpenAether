# OpenAether 0.5.0 Sprint C — ExternalSecrets Grafana
# ──────────────────────────────────────────────────────────────────
# grafana-admin: credentials UI (admin login) → services-observability
# grafana-db-credentials: password PostgreSQL CNPG → services-observability
#   ET foundation-databases (CNPG bootstrap.initdb.secret).
#
# Seeding: vault/bootstrap-roles-job.yaml step 10 génère ces secrets
# dans OpenBao si absents.

# ── Admin UI Grafana ───────────────────────────────────────────────
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin
        property: password

# ── DB credentials dans services-observability (Grafana HelmRelease) ──
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-credentials
  namespace: services-observability
  labels:
    openaether.io/managed: "true"
    openaether.io/sprint: "0.5.0-sprintC"
    openaether.io/component: grafana
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: grafana-db-credentials
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: grafana/db
        property: password
