apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-ingressgateway
  namespace: foundation-service-mesh
spec:
  chart:
    spec:
      chart: gateway
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istiod
  values:
    # istio-ingressgateway = L7 ingress Nord-Sud (GatewayClass istio)
    # Remplace Traefik. Listeners 80/443, TLS via cert-manager + OpenBao PKI.
    replicaCount: 2
    autoscaleEnabled: true
    autoscaleMin: 2
    autoscaleMax: 5
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    service:
      type: LoadBalancer
      ports:
        - name: http2
          port: 80
          targetPort: 8080
        - name: https
          port: 443
          targetPort: 8443
    # Gateway API: ce Deployment crée les pods qui recevront les Gateway/HTTPRoute
