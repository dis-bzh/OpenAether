apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: foundation-service-mesh
spec:
  chart:
    spec:
      chart: istiod
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-base
  values:
    global:
      defaultRevision: default
    pilot:
      replicaCount: 2
      autoscaleEnabled: true
      autoscaleMin: 2
      autoscaleMax: 5
    meshConfig:
      enableAutoMtls: true
      trustDomain: openaether.local
      trustDomainAliases: ["openaether.eu"]
    revision: default
