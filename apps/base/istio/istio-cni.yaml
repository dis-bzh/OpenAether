apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: foundation-service-mesh
spec:
  chart:
    spec:
      chart: cni
      version: "1.24.2"
      sourceRef:
        kind: HelmRepository
        name: istio
        namespace: foundation-service-mesh
      interval: 1h
  dependsOn:
    - name: istio-base
  values:
    # CNI chaîné APRÈS Cilium (Cilium = 05-cilium.conflist, Istio = ZZ-istio-cni.conflist)
    # Cilium doit avoir: cni.exclusive=false, socketLB.hostNamespaceOnly=true
    chained: true
    logLevel: info
    excludeNamespaces:
      - kube-system
      - management-gitops
      - local-path-storage
