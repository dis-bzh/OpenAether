# Local-only: MinIO S3 compatible pour test local (pas de HelmRelease → dans minio/ séparé).
# Actif en local car S3 est nécessaire pour tester Loki/Grafana config sans Longhorn.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage-minio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/storage/minio
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
