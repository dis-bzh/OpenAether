# Local-only: install local-path-provisioner as default StorageClass.
# Talos Docker has no dynamic provisioner; OpenBao + other StatefulSets need
# storageClassName: local-path (used in pki-root, vault statefulsets).
# Not deployed in management/cloud clusters (Longhorn covers that role).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-local-storage
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/platform/local-path-provisioner
  prune: true
  wait: true
  dependsOn:
    - name: namespaces
