# Groupe 20 — CloudNative-PG (operator + clusters)
# Dépend d'eso (ExternalSecrets pour grafana-db-credentials).
# Isolation : crash CNPG n'impacte pas la stack foundation ni la storage layer.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cnpg
  prune: true
  wait: true
  dependsOn:
    - name: external-secrets
