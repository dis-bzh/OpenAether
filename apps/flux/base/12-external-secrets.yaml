# Groupe 12 — External Secrets Operator
# Dépend uniquement des namespaces (pas de vault : ESO s'installe avant de se connecter).
# ClusterSecretStore openbao sera opérationnel une fois vault prêt (retry auto).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/external-secrets
  prune: true
  wait: true
  dependsOn:
    - name: namespaces
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-stores
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 3m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/external-secrets/stores
  prune: true
  wait: false
  dependsOn:
    - name: external-secrets
    - name: foundation-vault
