# Groupe 14 — Istio ambient (5 HelmReleases : base, istiod, cni, ztunnel, ingressgateway)
# Dépend de cert-manager (certificats mTLS).
# Blast-radius isolé : une mise à jour Istio n'impacte pas la stack foundation.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 20m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/istio
  prune: true
  wait: true
  dependsOn:
    - name: platform-gateway-api
    - name: cert-manager
