# Groupe 13 — cert-manager (HelmRelease)
# Dépend de vault (ClusterIssuers OpenBao PKI) et d'eso (ExternalSecrets).
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  timeout: 15m
  sourceRef:
    kind: GitRepository
    name: openaether
  path: ./apps/base/cert-manager
  prune: true
  wait: true
  dependsOn:
    - name: foundation-vault
    - name: external-secrets
