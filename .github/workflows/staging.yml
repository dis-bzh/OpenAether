name: Staging

# The credentialed rung. Everything else in CI runs without a cloud account;
# this one spends money on a real provider, so its trigger surface is the whole
# design.
#
# ⚠️ NEVER add `pull_request` here. GitHub withholds secrets from fork pull
# requests on purpose, and the usual workaround — `pull_request_target` — runs
# with this repository's secrets in its own context: checking out the PR's code
# under it hands a stranger the cloud credentials. This repository is public.
# The only triggers are ones a maintainer controls.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to exercise
        type: choice
        options: [scaleway, ovh, outscale]
        default: scaleway
      role:
        description: Cluster role
        type: choice
        options: [management, workload]
        default: management
      keep:
        description: Leave the cluster up after the run (for manual inspection)
        type: boolean
        default: false
      stages:
        description: How far to go — deploy only, or also prove it can be kept
        type: choice
        options: [deploy, deploy+idempotency, full]
        default: full
  schedule:
    # Weekly, Monday 03:17 UTC. Off the hour so it does not pile up with
    # everything else the runners fire at :00.
    - cron: "17 3 * * 1"

# One staging cluster at a time. Two concurrent runs would collide on resource
# names and on the remote state, and the loser would leave billed VMs behind.
# Never cancel in progress: an interrupted apply is exactly what orphans things.
concurrency:
  group: staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A dispatch exercises the one provider a maintainer picked; the weekly run
  # exercises all three. Without this the cron fell through to `inputs.provider
  # || 'scaleway'` and OVH and Outscale had no unattended coverage at all — the
  # two providers where the known upgrade defect actually reproduces.
  scope:
    name: What this run covers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      providers: ${{ steps.pick.outputs.providers }}
      stages: ${{ steps.pick.outputs.stages }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          PROVIDER: ${{ inputs.provider }}
          STAGES: ${{ inputs.stages }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "schedule" ]; then
            echo 'providers=["scaleway","ovh","outscale"]' >> "$GITHUB_OUTPUT"
            echo 'stages=full' >> "$GITHUB_OUTPUT"
          else
            echo "providers=[\"${PROVIDER}\"]" >> "$GITHUB_OUTPUT"
            echo "stages=${STAGES}" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: "Deploy, prove, destroy (${{ matrix.provider }})"
    needs: scope
    runs-on: ubuntu-latest
    # Deploy is ~25 min; idempotency adds a second bring-up; the upgrade adds an
    # image build, two applies and one reboot per node. 90 was sized for the
    # first of the three.
    timeout-minutes: 210
    strategy:
      # Never fail-fast: a provider dying must not cancel the others mid-apply,
      # which is precisely how billed resources get orphaned.
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.scope.outputs.providers) }}
    # The Environment holds the secrets and gates who can reach them. It exists,
    # and its deployment branch policy is `main` only — no other branch can get
    # the cloud credentials, which is the protection that matters in a public
    # repository. Deliberately NO required reviewer: an approval gate would block
    # the weekly run, and an unattended lane nobody approves is a lane that never
    # runs. What keeps the spend bounded instead is the `if: always()` teardown
    # below and the `reap` job, which runs even when this job never got there.
    environment: staging
    env:
      PROVIDER: ${{ matrix.provider }}
      ROLE: ${{ inputs.role || 'management' }}
      STAGES: ${{ needs.scope.outputs.stages }}
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      # `task infra` and `bootstrap-phase2` apply WITHOUT -auto-approve, on
      # purpose: a human running `task up` should be asked before spending. With
      # TF_INPUT=0 and no tty that same apply just aborts, so this job could
      # never have deployed anything. Same mechanism fleet-down uses for destroy.
      TF_CLI_ARGS_apply: -auto-approve
      # And the destroy needs its OWN variable. Only `apply` was set here, so the
      # teardown step — the one thing that must never be skipped — would have hit
      # `task destroy`'s no-terminal guard and left the cluster billing. Measured
      # locally on 2026-08-14, on exactly that guard.
      TF_CLI_ARGS_destroy: -auto-approve
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.5"

      # No separate Task step here: setup.sh installs it, through the same pinned
      # installer CI uses. There used to be one, and it ran an unauthenticated
      # releases-API call before the step that would have installed Task anyway.
      - name: Setup toolchain
        run: ./scripts/setup.sh

      # A dedicated staging account, never one that holds anything real. Every
      # value below is a repository/environment secret — none of them belongs in
      # git, and the teardown reads the same ones.
      - name: Load credentials
        run: |
          {
            echo "TF_VAR_encryption_passphrase=${{ secrets.STAGING_ENCRYPTION_PASSPHRASE }}"
            case "$PROVIDER" in
              scaleway)
                echo "SCW_ACCESS_KEY=${{ secrets.STAGING_SCW_ACCESS_KEY }}"
                echo "SCW_SECRET_KEY=${{ secrets.STAGING_SCW_SECRET_KEY }}"
                echo "SCW_DEFAULT_PROJECT_ID=${{ secrets.STAGING_SCW_PROJECT_ID }}"
                echo "SCW_AWS_ACCESS_KEY_ID=${{ secrets.STAGING_SCW_ACCESS_KEY }}"
                echo "SCW_AWS_SECRET_ACCESS_KEY=${{ secrets.STAGING_SCW_SECRET_KEY }}"
                ;;
              ovh)
                echo "OS_AUTH_URL=${{ secrets.STAGING_OS_AUTH_URL }}"
                echo "OS_PROJECT_ID=${{ secrets.STAGING_OS_PROJECT_ID }}"
                echo "OS_USERNAME=${{ secrets.STAGING_OS_USERNAME }}"
                echo "OS_PASSWORD=${{ secrets.STAGING_OS_PASSWORD }}"
                echo "OS_REGION_NAME=${{ secrets.STAGING_OS_REGION_NAME }}"
                echo "OVH_AWS_ACCESS_KEY_ID=${{ secrets.STAGING_OVH_S3_ACCESS_KEY }}"
                echo "OVH_AWS_SECRET_ACCESS_KEY=${{ secrets.STAGING_OVH_S3_SECRET_KEY }}"
                ;;
              outscale)
                echo "OUTSCALE_ACCESS_KEY_ID=${{ secrets.STAGING_OSC_ACCESS_KEY }}"
                echo "OUTSCALE_SECRET_KEY=${{ secrets.STAGING_OSC_SECRET_KEY }}"
                echo "OUTSCALE_AWS_ACCESS_KEY_ID=${{ secrets.STAGING_OSC_ACCESS_KEY }}"
                echo "OUTSCALE_AWS_SECRET_ACCESS_KEY=${{ secrets.STAGING_OSC_SECRET_KEY }}"
                ;;
            esac
          } >> "$GITHUB_ENV"

      # The tfvars is environment data and stays out of git — the whole point of
      # the split. One base64 secret PER PROVIDER, built from the matching
      # envs/*.tfvars.example: a single shared blob would write Scaleway's
      # addresses into OVH's env file the moment this ran as a matrix.
      #
      # Each one is expected to pin talos_version / kubernetes_version one patch
      # BELOW cluster/variables.tf, which is what gives the upgrade stage
      # something real to move. See scripts/dev/staging-upgrade.sh.
      - name: Materialise the tfvars
        env:
          TFVARS_B64_SCALEWAY: ${{ secrets.STAGING_TFVARS_B64_SCALEWAY }}
          TFVARS_B64_OVH: ${{ secrets.STAGING_TFVARS_B64_OVH }}
          TFVARS_B64_OUTSCALE: ${{ secrets.STAGING_TFVARS_B64_OUTSCALE }}
        run: |
          set -euo pipefail
          var="TFVARS_B64_$(echo "$PROVIDER" | tr '[:lower:]' '[:upper:]')"
          blob="${!var:-}"
          test -n "$blob" || { echo "::error::secret STAGING_${var} is empty"; exit 1; }
          printf '%s' "$blob" | base64 -d \
            > "infrastructure/opentofu/cluster/envs/${ROLE}-${PROVIDER}.tfvars"

      # `task up` refuses before it bills if the key is missing, and every later
      # stage needs it too (bootstrap-phase2, the tunnels, rolling-replace). Its
      # public half belongs in the tfvars above, or the bastion will not take it.
      - name: Install the bastion SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_PRIVATE_KEY" || { echo "::error::STAGING_SSH_PRIVATE_KEY is empty"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

      - name: Preflight quotas
        continue-on-error: true
        run: task preflight-quotas PROVIDER="$PROVIDER"

      - name: Deploy
        id: deploy
        run: task up ROLE="$ROLE" PROVIDER="$PROVIDER" YES=1

      # A deploy is not finished when OpenTofu is. Without the Day-1 backup and
      # observability secrets, six Kustomizations never leave not-Ready and the
      # DAG never converges — so a lane that skipped this could only ever have
      # asserted a convergence the product does not deliver on its own.
      # Write-if-absent: safe to re-run, and it will not rotate backup/restic.
      - name: Seed the Day-1 secrets
        env:
          OA_SLACK_WEBHOOK_URL: ${{ secrets.STAGING_SLACK_WEBHOOK_URL }}
          OA_DEADMANSSWITCH_URL: ${{ secrets.STAGING_DEADMANSSWITCH_URL }}
        run: ./scripts/ops/seed-openbao.sh "$PROVIDER" "$ROLE"

      - name: Verify
        run: ./scripts/dev/staging-verify.sh "$PROVIDER" "$ROLE"

      # Building a cluster and keeping one are different claims. These two
      # stages are the second; 1.0.0 shipped having proven only the first.
      - name: Idempotency — a second bring-up must change nothing
        if: env.STAGES != 'deploy'
        run: ./scripts/dev/staging-idempotency.sh "$PROVIDER" "$ROLE"

      - name: Upgrade — Kubernetes then Talos, in place, with a probe running
        if: env.STAGES == 'full'
        run: ./scripts/dev/staging-upgrade.sh "$PROVIDER" "$ROLE"

      # `if: always()` is the load-bearing line in this file. A failed apply is
      # precisely the case that leaves billed resources standing, so the teardown
      # must run when the deploy did NOT succeed — and it must not be skipped by
      # a cancelled job either.
      - name: Destroy
        if: always() && !(inputs.keep && github.event_name == 'workflow_dispatch')
        run: task fleet-down PROVIDER="$PROVIDER" ROLE="$ROLE" -- --yes

      # This asserts now. The purge scripts printed what they found and exited 0
      # regardless, so this step passed while ten Scaleway resources were billing
      # (2026-08-14). A dry run that finds anything exits 1.
      - name: Confirm the provider is clean
        if: always() && !(inputs.keep && github.event_name == 'workflow_dispatch')
        run: python3 "scripts/ops/purge-orphans/${PROVIDER}.py"

  # The reaper does not depend on the job above, and that is the point: it has
  # to run when that job died, was cancelled, or never got to its teardown.
  reap:
    name: Sweep the staging account
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        provider: [scaleway, ovh, outscale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup toolchain
        run: ./scripts/setup.sh

      - name: Load credentials
        run: |
          {
            echo "SCW_ACCESS_KEY=${{ secrets.STAGING_SCW_ACCESS_KEY }}"
            echo "SCW_SECRET_KEY=${{ secrets.STAGING_SCW_SECRET_KEY }}"
            echo "SCW_DEFAULT_PROJECT_ID=${{ secrets.STAGING_SCW_PROJECT_ID }}"
            echo "OS_AUTH_URL=${{ secrets.STAGING_OS_AUTH_URL }}"
            echo "OS_PROJECT_ID=${{ secrets.STAGING_OS_PROJECT_ID }}"
            echo "OS_USERNAME=${{ secrets.STAGING_OS_USERNAME }}"
            echo "OS_PASSWORD=${{ secrets.STAGING_OS_PASSWORD }}"
            echo "OS_REGION_NAME=${{ secrets.STAGING_OS_REGION_NAME }}"
            echo "OUTSCALE_ACCESS_KEY_ID=${{ secrets.STAGING_OSC_ACCESS_KEY }}"
            echo "OUTSCALE_SECRET_KEY=${{ secrets.STAGING_OSC_SECRET_KEY }}"
          } >> "$GITHUB_ENV"

      # Read-only by default (the purge scripts are dry-run unless told
      # otherwise), so a green run means "nothing left" and a red one names what
      # to delete. Deleting on a schedule, unattended, is a bigger risk than the
      # leak it would prevent.
      - name: Report what is still standing
        run: python3 "scripts/ops/purge-orphans/${{ matrix.provider }}.py"
