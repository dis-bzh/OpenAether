name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All jobs here are read-only validation — always safe to cancel a superseded run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The commit-msg hooks that enforce this live in .git/hooks/, which no clone
  # carries — so the same checks run here on every subject a PR adds.
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # cz needs the range, and the default single-commit checkout has none.
          fetch-depth: 0

      - name: Install commitizen
        # renovate: datasource=pypi depName=commitizen
        run: pip install commitizen==4.9.1

      - name: Conventional Commits
        run: cz check --rev-range origin/${{ github.base_ref }}..HEAD

      # Scoped by the tree, not by a date or a pinned sha: a commit is checked
      # only if the rule already existed in it. Commits predating the rule are
      # skipped rather than rewritten.
      - name: No authorship trailer naming a tool
        run: |
          check=scripts/dev/check-commit-trailers.sh
          for sha in $(git log --format=%H "origin/${{ github.base_ref }}..HEAD"); do
            git cat-file -e "$sha:$check" 2>/dev/null || continue
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/msg"
            "./$check" "$RUNNER_TEMP/msg"
          done

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.5"

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a  # v6
        with:
          tflint_version: latest

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0

      - name: Install yamllint
        run: pip install yamllint

      - name: Validate Renovate config
        run: npx --yes -p renovate -- renovate-config-validator renovate.json5

      # One-time per-runner setup task itself doesn't need — tflint plugin init
      # is CI-specific (a fresh runner has no cached plugins); local dev covers
      # this via `task setup`.
      - name: tflint init
        run: tflint --init
        working-directory: infrastructure/opentofu

      - name: task lint
        run: task lint

  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        # Validate every OpenTofu root, not just the cluster. talos-image is a
        # separate root (own backend + providers).
        root: [cluster, talos-image]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.5"

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0

      - name: task validate
        run: task validate ROOT=${{ matrix.root }}
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          TF_VAR_encryption_passphrase: ci-mock-passphrase-for-validation-only-ci

  test:
    name: OpenTofu Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.5"

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0

      - name: task test
        run: task test
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: mock
          AWS_SECRET_ACCESS_KEY: mock
          TF_VAR_encryption_passphrase: ci-mock-passphrase-for-validation-only-ci

  emulated:
    name: Emulated Cloud (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    # The real provider binaries against a real HTTP API, with no account: one
    # step past `tofu test`, which mocks the provider and never leaves the
    # process. See docs/emulated-cloud.md for what it does and does not prove.
    strategy:
      fail-fast: false
      matrix:
        provider: [scaleway, outscale]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2
        with:
          # renovate: datasource=github-releases depName=opentofu/opentofu extractVersion=^v(?<version>.*)$
          tofu_version: "1.12.5"

      - name: Setup Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0

      - name: Install Feint (pinned + checksum-verified)
        run: |
          ./scripts/dev/feint.sh install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: task feint-up
        run: task feint-up

      # No credentials anywhere in this job, deliberately: the lane must fail if
      # anything in it ever needs one, rather than quietly reaching a real cloud.
      - name: task feint-plan
        run: task feint-plan PROVIDER=${{ matrix.provider }}

      - name: task feint-apply
        run: task feint-apply PROVIDER=${{ matrix.provider }}

      - name: task feint-down
        if: always()
        run: task feint-down

  talos:
    name: Talos Config Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Install talosctl (pinned + checksum-verified)
        env:
          # renovate: datasource=github-releases depName=siderolabs/talos
          TALOS_VERSION: "v1.13.7"
        run: |
          set -euo pipefail
          base="https://github.com/siderolabs/talos/releases/download/${TALOS_VERSION}"
          curl -fsSL -o talosctl-linux-amd64 "${base}/talosctl-linux-amd64"
          curl -fsSL "${base}/sha256sum.txt" | grep ' talosctl-linux-amd64$' > sha256sum.txt
          sha256sum -c sha256sum.txt
          chmod +x talosctl-linux-amd64
          sudo install -m 0755 talosctl-linux-amd64 /usr/local/bin/talosctl
          talosctl version --client

      - name: Generate Talos secrets
        run: talosctl gen secrets --output-file /tmp/talos-secrets.yaml

      - name: Generate Talos configs
        run: |
          talosctl gen config \
            --with-secrets /tmp/talos-secrets.yaml \
            --output /tmp/talos-configs \
            --output-types controlplane,worker \
            ci-test-cluster https://127.0.0.1:6443

      - name: Validate control plane config
        run: talosctl validate --config /tmp/talos-configs/controlplane.yaml --mode metal

      - name: Validate worker config
        run: talosctl validate --config /tmp/talos-configs/worker.yaml --mode metal

      - name: Check kube-proxy is disabled
        run: |
          grep -q 'disabled: true' /tmp/talos-configs/controlplane.yaml

  security:
    name: IaC Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          scan-type: config
          scan-ref: infrastructure/
          severity: HIGH,CRITICAL
          exit-code: 1
          # Exclude the upstream-vendored bootstrap manifests from the IaC gate.
          # cilium*.yaml (helm template cilium) and flux-install.yaml (Flux's
          # official install.yaml) are not our configuration to fix — their
          # privileged/host-network/wildcard-RBAC posture is inherent to a CNI
          # and a GitOps reconciler. They are reviewed when regenerated by
          # scripts/render-bootstrap-manifests.sh. Our own template
          # flux-bootstrap.yaml.tftpl is still scanned.
          skip-files: |
            **/bootstrap-manifests/cilium*.yaml
            **/bootstrap-manifests/flux-install.yaml

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7  # v12
        with:
          directory: infrastructure/opentofu
          # framework is declared in .checkov.yaml; not duplicated here.
          # soft_fail removed: Checkov now gates the pipeline. Add explicit,
          # justified exceptions in .checkov.yaml (skip-check) rather than
          # silencing every finding.
          config_file: .checkov.yaml
